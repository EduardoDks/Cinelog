<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineLog - Seu Backlog de Mídia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a class="logo" onclick="filterBacklog('all', this)">CineLog</a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar filmes, animes... (Enter)">
    </div>
    <nav>
      <button class="active" onclick="filterBacklog('all', this)">Todos</button>
      <button onclick="filterBacklog('watched', this)">Assistidos</button>
      <button onclick="filterBacklog('plan_to_watch', this)">Quero Assistir</button>
    </nav>
  </header>

  <main class="container">
    <div class="section-header">
      <h2 class="section-title" id="pageTitle">Meu Backlog</h2>
    </div>

    <div class="media-grid" id="mediaGrid"></div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="mediaModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalMediaTitle">Nome da Mídia</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="mediaForm">
        <input type="hidden" id="modalTmdbId">
        <input type="hidden" id="modalMediaType">
        <input type="hidden" id="modalPosterPath">
        <input type="hidden" id="modalOverview">

        <div class="form-group">
          <label>Sinopse</label>
          <p id="modalOverviewText" style="font-size: 0.85rem; color: #a0a5b1; line-height: 1.4; max-height: 100px; overflow-y: auto; background: #2b303b; padding: 10px; border-radius: 6px; border: 1px solid #3d4351;">
            Sem sinopse disponível.
          </p>
        </div>

        <div class="form-group">
          <label for="modalStatus">Status</label>
          <select id="modalStatus" required>
            <option value="watched">Assistido</option>
            <option value="plan_to_watch">Quero Assistir</option>
          </select>
        </div>

        <div class="form-group">
          <label for="modalRating">Sua Nota (1.0 a 5.0)</label>
          <input type="number" id="modalRating" min="1" max="5" step="0.5" placeholder="Ex: 4.5">
        </div>

        <div class="form-group">
          <label for="modalReview">Sua Análise / Comentário</label>
          <textarea id="modalReview" rows="3" placeholder="O que achou dessa mídia?"></textarea>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-submit">Salvar no Backlog</button>
          <button type="button" class="btn-delete" id="btnDelete" onclick="deleteMedia()">Remover</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
